<div class="container">
  <mat-card class="product-form-card">
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Product' : 'Create New Product' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="loading" class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>

      <form [formGroup]="productForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
        <app-custom-input
          label="Name"
          placeholder="Product name"
          type="text"
          [required]="true"
          [maxLength]="100"
          [control]="productForm.get('name')"
          [errorMessage]="getErrorMessage('name')"
          formControlName="name">
        </app-custom-input>

        <app-custom-textarea
          label="Description"
          placeholder="Product description"
          [maxLength]="255"
          [rows]="3"
          [control]="productForm.get('description')"
          [errorMessage]="getErrorMessage('description')"
          hint="Optional - Maximum 255 characters"
          formControlName="description">
        </app-custom-textarea>

        <app-custom-input
          label="Price"
          placeholder="0.00"
          type="number"
          [required]="true"
          [min]="0.01"
          step="0.01"
          [control]="productForm.get('price')"
          [errorMessage]="getErrorMessage('price')"
          formControlName="price">
        </app-custom-input>

        <app-custom-input
          label="Code"
          placeholder="Product code"
          type="text"
          [control]="productForm.get('code')"
          hint="Optional - Product identifier code"
          formControlName="code">
        </app-custom-input>

        <app-custom-select
          label="Category"
          placeholder="Select a category"
          [required]="true"
          [options]="categoryOptions"
          [control]="productForm.get('categoryId')"
          [errorMessage]="getErrorMessage('categoryId')"
          formControlName="categoryId">
        </app-custom-select>

        <div class="checkbox-field">
          <mat-checkbox formControlName="status">Active</mat-checkbox>
        </div>

        <div class="button-container">
          <button type="button" mat-button [routerLink]="['/products']">Cancel</button>
          <button type="submit" mat-raised-button color="primary" [disabled]="productForm.invalid">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

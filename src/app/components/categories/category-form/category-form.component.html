<div class="container">
  <mat-card class="category-form-card">
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Category' : 'Create New Category' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="loading" class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>

      <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
        <app-custom-input
          label="Name"
          placeholder="Category name"
          type="text"
          [required]="true"
          [maxLength]="100"
          [control]="categoryForm.get('name')"
          [errorMessage]="getErrorMessage('name')"
          formControlName="name">
        </app-custom-input>

        <app-custom-textarea
          label="Description"
          placeholder="Category description"
          [maxLength]="255"
          [rows]="3"
          [control]="categoryForm.get('description')"
          [errorMessage]="getErrorMessage('description')"
          hint="Optional - Maximum 255 characters"
          formControlName="description">
        </app-custom-textarea>

        <div class="button-container">
          <button type="button" mat-button [routerLink]="['/categories']">Cancel</button>
          <button type="submit" mat-raised-button color="primary" [disabled]="categoryForm.invalid">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

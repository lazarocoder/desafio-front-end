<div class="register-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Registro</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <app-custom-input
          label="Nome"
          placeholder="Digite seu nome"
          type="text"
          [required]="true"
          [control]="registerForm.get('name')"
          [errorMessage]="getErrorMessage('name')"
          formControlName="name">
        </app-custom-input>

        <app-custom-input
          label="Email"
          placeholder="Digite seu email"
          type="email"
          [required]="true"
          [control]="registerForm.get('email')"
          [errorMessage]="getErrorMessage('email')"
          formControlName="email">
        </app-custom-input>

        <app-custom-input
          label="Senha"
          placeholder="Digite sua senha"
          type="password"
          [required]="true"
          [control]="registerForm.get('password')"
          [errorMessage]="getErrorMessage('password')"
          hint="Mínimo 6 caracteres"
          formControlName="password">
        </app-custom-input>

        <app-custom-input
          label="Confirmar Senha"
          placeholder="Confirme sua senha"
          type="password"
          [required]="true"
          [control]="registerForm.get('confirmPassword')"
          [errorMessage]="getErrorMessage('confirmPassword')"
          formControlName="confirmPassword">
        </app-custom-input>

        <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid">
          Registrar
        </button>

        <div class="login-link">
          <a mat-button routerLink="/auth/login">Já tem uma conta? Faça login</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
